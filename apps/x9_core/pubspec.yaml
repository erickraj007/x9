name: x9_core
description: Shared code for the X9 user and merchant apps (API client, session, device approval, app lock, theme, widgets).
version: 1.0.1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  intl: ">=0.19.0 <0.21.0"
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/brand/
